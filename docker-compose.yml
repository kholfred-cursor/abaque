services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["bash", "/scripts/mongo-init.sh"]

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - api

volumes:
  mongo-data:
